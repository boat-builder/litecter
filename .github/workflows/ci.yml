name: ci

# PR gate for what the release build can't catch until after merge — the
# release workflow runs on main, so anything it would fail on has already
# landed by the time it complains.
#
# The Rust job deliberately builds only litecter-core and litecter (the CLI),
# not litecter-app: the Tauri crate needs webkit2gtk and friends on Linux,
# which would mean apt-installing a GUI stack to typecheck a desktop app that
# only ships for macOS. The macOS release build covers litecter-app, and the
# two library crates are where the logic actually lives.
#
# cargo fmt is not enforced — the tree is not rustfmt-clean and reformatting it
# is a separate decision from adding CI. Run `cargo fmt --all` and add a
# `cargo fmt --all -- --check` step here if you want that gate.

on:
  pull_request:

jobs:
  rust:
    name: Clippy + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'

      - name: Clippy
        run: cargo clippy -p litecter-core -p litecter --all-targets -- -D warnings

      - name: Tests
        run: cargo test -p litecter-core -p litecter

  frontend:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # svelte-check rather than `tsc --noEmit`: tsconfig includes src/**/*.svelte
      # and tsc cannot parse those, so tsc alone would only cover api.ts/main.ts.
      - name: Typecheck
        working-directory: app
        run: npm run check

  worker:
    name: Typecheck sync worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      # The Worker ships as plain JavaScript so that what a user pastes into
      # their own Cloudflare account is byte-for-byte what lives here. Types
      # come from JSDoc under checkJs, so a broken deploy is still caught.
      - name: Typecheck
        working-directory: worker
        run: npx tsc --noEmit

      # The app parses WORKER_VERSION out of this file to decide whether a
      # user's deployment is behind. A rename or a non-numeric value would
      # silently disable that check rather than fail anything, so it is asserted
      # here as well as in litecter-core's tests.
      - name: Worker declares a parseable version
        run: |
          grep -Eq '^const WORKER_VERSION = [0-9]+;$' worker/src/index.js \
            || { echo "worker/src/index.js must declare 'const WORKER_VERSION = <n>;'" >&2; exit 1; }
