[package]
name = "litecter-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.6"
# XChaCha20-Poly1305 seals the sync document client-side; `getrandom` supplies
# the nonce and the root key from the OS CSPRNG.
chacha20poly1305 = { version = "0.10.1", features = ["getrandom"] }
chromiumoxide = "0.9.1"
chrono = "0.4.45"
fastrand = "2.5.0"
futures = "0.3.34"
getrandom = "0.3.4"
regex = "1.13.1"
# Already in the tree via chromiumoxide (which only talks to localhost); the
# sync client is what needs TLS, hence rustls rather than a system stack.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "http2"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.1.2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time", "macros", "signal"] }
url = "2.5.8"
zstd = "0.13.3"
